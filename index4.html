<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebAR Keris - Info Top-Right, Home Bottom-Left</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    /* --- 1. UI CONTAINER NAVIGASI (TENGAH BAWAH) --- */
    #ui-container {
      display: none; /* Default sembunyi */
      position: fixed;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      width: auto; min-width: 200px; max-width: 60%; /* Agar tidak menabrak tombol kiri kanan */
      background: rgba(0, 0, 0, 0.8);
      padding: 10px; border-radius: 20px;
      flex-direction: column; gap: 10px;
      z-index: 1000; backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    #item-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }

    .keris-btn {
      background: rgba(255, 255, 255, 0.15); color: white;
      border: 1px solid rgba(255,255,255,0.2); padding: 8px 10px;
      border-radius: 8px; font-size: 12px; cursor: pointer;
      flex: 1 1 auto; text-align: center;
    }

    .keris-btn:hover, .keris-btn.active { background: #8B0000; border-color: #ff4d4d; }

    #pagination-controls {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px;
    }

    .nav-btn {
      background: white; color: black; border: none;
      padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .nav-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    #page-info { color: white; font-size: 11px; }

    /* --- 2. TOMBOL INFO (POJOK KANAN ATAS - DIUBAH) --- */
    #btn-info-trigger {
      display: none; /* Sembunyi sampai marker ketemu */
      position: fixed;
      top: 20px; /* Kembali ke atas */
      right: 20px; /* Tetap di kanan */
      width: 50px; height: 50px;
      background: #8B0000; color: white;
      border: 2px solid white; border-radius: 50%;
      font-size: 24px; font-weight: bold;
      z-index: 1001; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }

    /* --- 3. TOMBOL HOME (POJOK KIRI BAWAH - TIDAK DIUBAH) --- */
    #btn-home {
      position: fixed;
      bottom: 20px; left: 20px; 
      width: 50px; height: 50px;
      background: white; color: #333;
      border-radius: 50%;
      text-decoration: none;
      display: flex; justify-content: center; align-items: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 1001;
      border: 2px solid #ddd;
    }
    #btn-home:hover { background: #f0f0f0; transform: scale(1.05); }

    /* --- 4. POPUP MODAL INFO --- */
    #info-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); z-index: 2000;
      justify-content: center; align-items: center;
    }

    .modal-content {
      background: white; padding: 25px; border-radius: 15px;
      width: 85%; max-width: 400px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative;
    }

    .modal-title { color: #8B0000; margin-top: 0; }
    .modal-desc { color: #333; line-height: 1.5; font-size: 14px; margin-bottom: 20px; text-align: left;}
    
    .action-buttons { display: flex; gap: 10px; justify-content: center; }

    .btn-link { background: #007BFF; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; border: none; cursor: pointer; }
    .btn-close { background: #555; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; border: none; cursor: pointer; }

    #scan-instruction {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px;
      pointer-events: none; z-index: 900;
    }
  </style>
</head>

<body>

  <div id="scan-instruction">Arahkan kamera ke kartu...</div>

  <a id="btn-home" href="index.html" title="Kembali ke Menu Utama">🏠</a>

  <button id="btn-info-trigger" onclick="openModal()">i</button>

  <div id="ui-container">
    <div id="item-list"></div>
    <div id="pagination-controls">
      <button id="btn-prev" class="nav-btn" onclick="changePage(-1)">&#10094;</button>
      <span id="page-info">1/1</span>
      <button id="btn-next" class="nav-btn" onclick="changePage(1)">&#10095;</button>
    </div>
  </div>

  <div id="info-modal">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-title">Judul Keris</h2>
      <p id="modal-desc" class="modal-desc">Deskripsi...</p>
      <div class="action-buttons">
        <a id="modal-link" href="#" target="_blank" class="btn-link">Lihat 3D</a>
        <button class="btn-close" onclick="closeModal()">Tutup</button>
      </div>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: kartu_baru.mind; autoStart: true; uiScanning: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true, physicallyCorrectLights"> 

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="0 2 2" intensity="1.5"></a-light>

    <a-entity id="marker" mindar-image-target="targetIndex: 0">
      <a-entity id="modelContainer" position="0 0 0" scale="1 1 1"></a-entity>
    </a-entity>

  </a-scene>

  <script>
    // --- 1. DATA LENGKAP ---
    const kerisList = [
      { 
        name: "1. Keris Merah", 
        file: "models/keris2.glb", 
        desc: "Keris Merah melambangkan keberanian.", 
        link: "https://tiuk821.github.io/keris-mindar/keris-3.html" 
      },
      { 
        name: "2. Keris Silver", 
        file: "models/keris3.glb", 
        desc: "Keris dengan lapisan perak murni.", 
        link: "https://tiuk821.github.io/keris-blippar/" 
      },
      { 
        name: "3. Keris Hitam", 
        file: "models/keris1.glb", 
        desc: "Keris hitam pekat yang menyimpan misteri.", 
        link: "https://tiuk821.github.io/keris-mindar/keris-2.html" 
      },
      // Data Dummy
      { name: "4. Naga", file: "models/keris1.glb", desc: "Naga", link: "#" },
      { name: "5. Pusaka", file: "models/keris2.glb", desc: "Pusaka", link: "#" },
      { name: "6. Jawa", file: "models/keris3.glb", desc: "Jawa", link: "#" },
    ];

    let currentPage = 1;
    const itemsPerPage = 6;
    let currentSelectedKeris = null; 

    const markerElement = document.getElementById("marker");
    const uiContainer = document.getElementById("ui-container");
    const infoTrigger = document.getElementById("btn-info-trigger");
    const instruction = document.getElementById("scan-instruction");
    const modelContainer = document.getElementById("modelContainer");
    
    // Modal Elements
    const infoModal = document.getElementById("info-modal");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-desc");
    const modalLink = document.getElementById("modal-link");

    // --- EVENT MARKER ---
    markerElement.addEventListener("targetFound", () => {
      uiContainer.style.display = "flex";
      instruction.style.display = "none";
    });

    markerElement.addEventListener("targetLost", () => {
      uiContainer.style.display = "none";
      infoTrigger.style.display = "none"; 
      instruction.style.display = "block";
      
      // Reset Logic
      while(modelContainer.firstChild) modelContainer.removeChild(modelContainer.firstChild);
      document.querySelectorAll('.keris-btn').forEach(b => b.classList.remove('active'));
      currentSelectedKeris = null;
    });

    // --- FUNGSI MODAL INFO ---
    function openModal() {
      if (!currentSelectedKeris) return; 

      modalTitle.innerText = currentSelectedKeris.name;
      modalDesc.innerText = currentSelectedKeris.desc;
      modalLink.href = currentSelectedKeris.link;

      infoModal.style.display = "flex";
    }

    function closeModal() {
      infoModal.style.display = "none";
    }

    // --- PAGINATION & RENDER ---
    function renderPagination() {
      const listContainer = document.getElementById("item-list");
      const pageInfo = document.getElementById("page-info");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");

      listContainer.innerHTML = "";

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const currentItems = kerisList.slice(startIndex, endIndex);

      currentItems.forEach(item => {
        const btn = document.createElement("div");
        btn.className = "keris-btn";
        btn.innerText = item.name;
        
        btn.onclick = () => {
            document.querySelectorAll('.keris-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            currentSelectedKeris = item;
            infoTrigger.style.display = "flex"; // Munculkan tombol info di kanan atas
            loadModel(item.file);
        };

        listContainer.appendChild(btn);
      });

      const totalPages = Math.ceil(kerisList.length / itemsPerPage);
      pageInfo.innerText = `Hal ${currentPage} / ${totalPages}`;
      btnPrev.disabled = currentPage === 1;
      btnNext.disabled = currentPage === totalPages;
    }

    function changePage(step) {
      currentPage += step;
      renderPagination();
    }

    function loadModel(path) {
      while(modelContainer.firstChild) modelContainer.removeChild(modelContainer.firstChild);

      const m = document.createElement("a-gltf-model");
      m.setAttribute("src", path);
      m.setAttribute("rotation", "0 0 -90"); 
      m.setAttribute("position", "0 0 0"); 
      m.setAttribute("scale", "0.1 0.1 0.1"); 

      modelContainer.appendChild(m);
    }

    renderPagination();

  </script>

</body>
</html>
