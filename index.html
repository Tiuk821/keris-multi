<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebAR Keris — Kartu + Featured</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin:0; overflow:hidden; font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .ui-container {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px;
      z-index: 1200; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
      background: rgba(255,255,255,0.92); padding:8px 10px; border-radius:18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      max-width: 92%;
    }
    .btn {
      padding:8px 12px; border-radius:14px; border:2px solid #8B0000;
      background:white; font-weight:600; cursor:pointer;
    }
    .btn.active { background:#8B0000; color:white; }
    .msg { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:1300;
           background:rgba(0,0,0,0.6); color:white; padding:8px 12px; border-radius:10px; }
    .info-panel {
      position:absolute; bottom:90px; left:50%; transform:translateX(-50%);
      z-index:1400; background:rgba(255,255,255,0.95); padding:12px; border-radius:12px;
      max-width:320px; text-align:left; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.15);
    }
    .info-title { color:#8B0000; font-weight:700; margin-bottom:6px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>

  <div id="msg" class="msg">Memuat...</div>
  <div id="ui" class="ui-container" style="display:none;"></div>

  <div id="info" class="info-panel">
    <div class="info-title" id="info-title"></div>
    <div id="info-text" style="font-size:14px;color:#222"></div>
  </div>

  <!-- Preload assets (optional but recommended) -->
  <a-assets timeout="8000">
    <!-- Jika koleksi besar, isi manual atau biarkan kosong dan model dimuat dinamis -->
    <!-- Contoh preload (jika ada): -->
    <!-- <a-asset-item id="keris1" src="models/keris1.glb"></a-asset-item> -->
  </a-assets>

  <!-- MindAR scene: gunakan relative path ke file .mind yang ada di folder yang sama -->
  <a-scene id="scene" embedded
           mindar-image="imageTargetSrc: kartu_baru.mind; autoStart: true; uiLoading: no; uiScanning: no;"
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-entity camera position="0 0 0"></a-entity>

    <!-- Dynamic target containers -->
    <a-entity id="targets-root"></a-entity>

  </a-scene>

<script>
/*
  Single-file implementation for:
  - One "card" marker (index 0) that shows UI and model
  - One "featured" marker (index 1) that, when present WITH card, switches model to featured
  - Models defined in `modelsList` array below (edit to add/remove)
  - index.html expects:
      ./kartu_baru.mind  (MindAR binary with 2 targets: card, featured)
      ./targets.json     (optional; MindAR export metadata)
      ./models/*.glb      (model files)
*/

// ---------- CONFIG: edit this array to add/remove keris ----------
const modelsList = [
  { id: 'm1', name: 'Keris Merah', file: 'models/keris1.glb', info: 'Keris merah, simbol keberanian.', isFeatured: false },
  { id: 'm2', name: 'Keris Silver', file: 'models/keris2.glb', info: 'Keris silver, kebijaksanaan.', isFeatured: false },
  { id: 'm3', name: 'Keris Hitam', file: 'models/keris3.glb', info: 'Keris hitam, misteri.', isFeatured: true }
];
// -----------------------------------------------------------------

const msg = document.getElementById('msg');
const ui = document.getElementById('ui');
const infoPanel = document.getElementById('info');
const infoTitle = document.getElementById('info-title');
const infoText = document.getElementById('info-text');
const targetsRoot = document.getElementById('targets-root');
const scene = document.getElementById('scene');

let cardIndex = 0;      // index untuk kartu (default 0)
let featuredIndex = 1;  // index untuk marker featured (default 1)

let markerStates = {};  // track visible markers
let currentSelected = modelsList[0]?.id || null;

// helper: create UI buttons from modelsList
function buildUI() {
  ui.innerHTML = '';
  modelsList.forEach(m => {
    const b = document.createElement('button');
    b.className = 'btn' + (m.id === currentSelected ? ' active' : '');
    b.textContent = m.name;
    b.onclick = () => {
      currentSelected = m.id;
      document.querySelectorAll('.btn').forEach(x => x.classList.toggle('active', x === b));
      updateView();
    };
    b.oncontextmenu = e => { e.preventDefault(); showInfo(m); }; // long press right-click -> info
    ui.appendChild(b);
  });
}

// show small info panel
function showInfo(m) {
  infoTitle.innerText = m.name;
  infoText.innerText = m.info || '';
  infoPanel.style.display = 'block';
  setTimeout(()=> infoPanel.style.display = 'none', 4000);
}

// create target entities: card (index 0) and featured (index 1)
// these entities are minimal: each contains a model-container a-entity where we attach a-gltf-model
function createTargets() {
  // card entity
  const card = document.createElement('a-entity');
  card.setAttribute('id','target-card');
  card.setAttribute('mindar-image-target', `targetIndex: ${cardIndex}`);
  const cardModelRoot = document.createElement('a-entity');
  cardModelRoot.setAttribute('id','card-model-root');
  cardModelRoot.setAttribute('visible','false');
  card.appendChild(cardModelRoot);
  targetsRoot.appendChild(card);

  // featured entity
  const feat = document.createElement('a-entity');
  feat.setAttribute('id','target-featured');
  feat.setAttribute('mindar-image-target', `targetIndex: ${featuredIndex}`);
  const featRoot = document.createElement('a-entity');
  featRoot.setAttribute('id','featured-root');
  featRoot.setAttribute('visible','false');
  feat.appendChild(featRoot);
  targetsRoot.appendChild(feat);

  // event listeners
  card.addEventListener('targetFound', () => { markerStates[cardIndex] = true; onMarkerChange(); });
  card.addEventListener('targetLost',  () => { markerStates[cardIndex] = false; onMarkerChange(); });

  feat.addEventListener('targetFound', () => { markerStates[featuredIndex] = true; onMarkerChange(); });
  feat.addEventListener('targetLost',  () => { markerStates[featuredIndex] = false; onMarkerChange(); });
}

// update what model is shown on the card marker
function updateView() {
  const visibleCard = !!markerStates[cardIndex];
  const visibleFeatured = !!markerStates[featuredIndex];
  const cardRoot = document.getElementById('card-model-root');
  const featRoot = document.getElementById('featured-root');

  // hide both until decision
  if (cardRoot) cardRoot.setAttribute('visible','false');
  if (featRoot) featRoot.setAttribute('visible','false');

  if (!visibleCard) {
    ui.style.display = 'none';
    return;
  }

  ui.style.display = 'flex';

  // determine which model to show
  let modelToShow = null;
  if (visibleFeatured) {
    // find model flagged isFeatured
    modelToShow = modelsList.find(m => m.isFeatured) || null;
  } else {
    modelToShow = modelsList.find(m => m.id === currentSelected) || modelsList[0];
  }
  if (!modelToShow) return;

  // clear previous child
  while (cardRoot.firstChild) cardRoot.removeChild(cardRoot.firstChild);

  // create a-gltf-model that points to model file relative to this index.html
  const g = document.createElement('a-gltf-model');
  // adjust path: if user uses models/filename in array, we use that directly.
  const modelSrc = modelToShow.file.startsWith('http') ? modelToShow.file : modelToShow.file;
  g.setAttribute('src', modelSrc);
  g.setAttribute('rotation', '0 0 0');
  g.setAttribute('position', '0 0 0');
  g.setAttribute('scale', '0.25 0.25 0.25');
  g.setAttribute('visible','true');
  // optional: add gentle rotation animation
  g.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear');

  cardRoot.appendChild(g);
  cardRoot.setAttribute('visible','true');
}

// marker change handler
function onMarkerChange() {
  // small debounce not necessary
  updateView();
}

// init
(function init() {
  // small checks
  if (!modelsList || modelsList.length === 0) {
    msg.innerText = 'Tidak ada model terdaftar. Edit array `modelsList` di kode.';
    return;
  }

  // build UI & targets
  buildUI();
  createTargets();

  // done loading
  msg.classList.add('hidden');

  // expose for debug
  window._AR = { modelsList, markerStates, updateView };
})();

</script>
</body>
</html>
